name: Build fancywm

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '输入版本号 (例：1.12.0)'
        required: true
        type: string
      prerelease:
        description: '是否发布为测试版? (true/false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  actions: write
  contents: write

jobs:

  build:

    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    steps:
    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Setup Windows SDK
      uses: GuillaumeFalourd/setup-windows10-sdk-action@v2
      with:
        sdk-version: 18362

    # 当前仓库（含 resx）
    - name: Checkout current repo
      uses: actions/checkout@v7

    # FancyWM 源码
    - name: Checkout FancyWM
      uses: actions/checkout@v7
      with:
        repository: FancyWM/fancywm
        ref: v${{ inputs.tag_name }}
        path: fancywm
        submodules: true
        fetch-depth: 0

    - name: Prepare source
      shell: pwsh
      run: |
        echo "fancywm-v${{ inputs.tag_name }}" >> $env:GITHUB_STEP_SUMMARY
        Copy-Item "$env:GITHUB_WORKSPACE\Strings.zh-CN.resx" "$env:GITHUB_WORKSPACE\fancywm\FancyWM\Resources\"

    - name: Use Nerdbank.GitVersioning to set version variables
      uses: dotnet/nbgv@v0.5.2
      id: nbgv
      with:
        path: ${{ github.workspace }}/fancywm

    - name: Restore the application
      working-directory: ${{ github.workspace }}/fancywm
      run: dotnet restore
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Build the application
      working-directory: ${{ github.workspace }}/fancywm
      run: dotnet build --no-restore --property WarningLevel=0 FancyWM.GUI
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Execute unit tests
      working-directory: ${{ github.workspace }}/fancywm
      run: |
        dotnet test FancyWM.Tests
        dotnet test FancyWM.Layouts.Tests

    - name: Debug build output
      working-directory: ${{ github.workspace }}/fancywm
      shell: pwsh
      run: |
        Get-ChildItem FancyWM.GUI/bin/Release -Recurse

    - name: Generate archive
      working-directory: ${{ github.workspace }}/fancywm
      shell: pwsh
      run: |
        $outDir = Get-ChildItem "FancyWM.GUI/bin/${{ matrix.configuration }}" -Directory | Select-Object -First 1
        Compress-Archive -Path "$($outDir.FullName)/*" -DestinationPath FancyWM.${{ matrix.configuration }}.x64.zip

        $hash = (Get-FileHash FancyWM.${{ matrix.configuration }}.x64.zip -Algorithm SHA256).Hash
        $hash | Out-File FancyWM.${{ matrix.configuration }}.x64.zip.sha256sum

        echo "SHA256 Checksum: $hash" >> $env:GITHUB_STEP_SUMMARY

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ inputs.tag_name }}
        name: ${{ inputs.tag_name }}
        prerelease: ${{ inputs.prerelease == 'true' }}
        files: |
          ${{ github.workspace }}/fancywm/FancyWM.${{ matrix.configuration }}.x64.zip
          ${{ github.workspace }}/fancywm/FancyWM.${{ matrix.configuration }}.x64.zip.sha256sum

    - name: Delete Old Workflows
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 7
        keep_minimum_runs: 7
